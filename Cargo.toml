[workspace]
resolver = "3"
members = ["crates/fsblame-abi", "crates/fsblame-bpf", "crates/fsblame", "xtask"]
default-members = ["crates/fsblame-abi", "crates/fsblame-bpf", "crates/fsblame"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
fsblame-abi = { path = "crates/fsblame-abi" }
fsblame-bpf = { path = "crates/fsblame-bpf" }

wire = { path = "../tracekit/crates/wire" }
procctx = { path = "../tracekit/crates/procctx" }
bpfdoctor = { path = "../tracekit/crates/bpfdoctor" }

aya = { version = "0.14.0", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
