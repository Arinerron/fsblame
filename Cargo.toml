[workspace]
resolver = "3"
members = ["crates/fsblame-abi", "crates/fsblame-bpf", "crates/fsblame", "xtask"]
default-members = ["crates/fsblame-abi", "crates/fsblame-bpf", "crates/fsblame"]
# The tracekit submodule is its own workspace, and so is the cargo-fuzz crate (nightly only).
exclude = ["tracekit", "fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Arinerron/fsblame"
homepage = "https://github.com/Arinerron/fsblame"

[workspace.dependencies]
# The three published crates move in lockstep (the BPF objects and the loader must agree on
# the ABI exactly): bump these `=` pins with `version` above.
fsblame-abi = { version = "=0.1.1", path = "crates/fsblame-abi" }
fsblame-bpf = { version = "=0.1.1", path = "crates/fsblame-bpf" }

# tracekit v0.1.0, pinned as the `tracekit` git submodule (`git submodule update --init`); the
# published crates resolve the same versions from crates.io.
wire = { version = "0.1.0", path = "tracekit/crates/wire", package = "tracekit-wire" }
procctx = { version = "0.1.0", path = "tracekit/crates/procctx" }
bpfdoctor = { version = "0.1.0", path = "tracekit/crates/bpfdoctor" }

aya = { version = "0.14.0", default-features = false }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
libc = "0.2"
log = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
