[package]
name = "fsblame-abi"
description = "Kernel/user ABI of fsblame: ring buffer records, map keys and values, shared constants"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fsblame-abi"
keywords = ["ebpf", "bpf", "abi", "filesystem", "no-std"]
categories = ["os::linux-apis", "filesystem", "no-std"]
include = ["src/**/*.rs", "LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[features]
# `aya::Pod` impls, for the loader.
user = ["dep:aya"]
# C header generation (`header()`), for the BPF build script.
std = ["wire/std"]

[dependencies]
wire.workspace = true
aya = { workspace = true, optional = true }

[lints]
workspace = true
