[package]
name = "fsblame"
description = "Which command changed this file? Live eBPF attribution of file changes to the full process lineage: argv, cwd, ancestors, systemd unit, container and build step."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/Arinerron/fsblame#readme"
readme = "../../README.md"
keywords = ["ebpf", "bpf", "filesystem", "audit", "observability"]
categories = ["command-line-utilities", "development-tools::debugging", "os::linux-apis", "filesystem"]
include = ["src/**/*.rs", "LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# `cargo binstall fsblame`: the static musl release tarball, for glibc hosts as well.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/fsblame-v{ version }-x86_64-linux-musl.tar.gz"
bin-dir = "fsblame-v{ version }-x86_64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/fsblame-v{ version }-x86_64-linux-musl.tar.gz"
bin-dir = "fsblame-v{ version }-x86_64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/fsblame-v{ version }-aarch64-linux-musl.tar.gz"
bin-dir = "fsblame-v{ version }-aarch64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/fsblame-v{ version }-aarch64-linux-musl.tar.gz"
bin-dir = "fsblame-v{ version }-aarch64-linux-musl/{ bin }"

[dependencies]
fsblame-abi = { workspace = true, features = ["user"] }
fsblame-bpf.workspace = true
procctx.workspace = true
wire.workspace = true
bpfdoctor.workspace = true
aya.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
libc.workspace = true
log.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
